# Runs when Terraform changes land on main (i.e. after a PR is merged).
# The merge is the human approval; this job makes Azure match the code.
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # manual "Run workflow" button (e.g. to retry)

permissions:
  id-token: write # OIDC login to Azure (subject: ref:refs/heads/main)
  contents: read

# Same group as plan/destroy: Terraform jobs queue, never run in parallel.
concurrency:
  group: terraform
  cancel-in-progress: false # never kill an apply halfway

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_allowed_ssh_cidr: ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}
  TF_VAR_admin_object_id: ${{ secrets.TF_VAR_ADMIN_OBJECT_ID }}
  TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate
      
      # Save the plan to a file so apply does exactly what is shown here.
      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=120s -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=120s tfplan